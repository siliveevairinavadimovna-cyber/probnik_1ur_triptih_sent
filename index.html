<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Пробный тренажер — контроль обучения</title>
  <style>
    :root{--navy:#173b5e;--blue:#237db5;--blue-soft:#e9f4fb;--orange:#f4862f;--green:#20895c;--green-soft:#e9f7f0;--red:#b84747;--red-soft:#fff0ef;--text:#25384a;--muted:#60778c;--line:#d3e0e9;--surface:#fff;--canvas:#edf5f9;--shadow:rgba(23,59,94,.14)}
    @media(prefers-color-scheme:dark){:root{--navy:#e7f2fb;--blue:#57b7ed;--blue-soft:#173a50;--orange:#ff9a4c;--green:#54c892;--green-soft:#173e31;--red:#ff8c8c;--red-soft:#4b2929;--text:#eaf3f9;--muted:#a9bfce;--line:#355367;--surface:#102838;--canvas:#091d29;--shadow:rgba(0,0,0,.28)}}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%}body{display:grid;place-items:center;background:var(--canvas);font-family:Arial,Helvetica,sans-serif}button{font:inherit}
    #trainer{width:min(100%,500px);height:500px;overflow:hidden;color:var(--text);background:var(--canvas);border:1px solid var(--line);border-radius:24px;box-shadow:0 16px 40px var(--shadow)}
    .top{height:58px;padding:13px 18px 10px;display:flex;align-items:center;justify-content:space-between;background:var(--surface);border-bottom:1px solid var(--line)}.kicker{color:var(--blue);font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase}.counter{min-width:72px;padding:6px 9px;color:var(--navy);background:var(--blue-soft);border:1px solid var(--line);border-radius:999px;text-align:center;font-size:12px;font-weight:800}
    .stage{height:calc(100% - 58px);padding:17px 18px 15px;display:flex;flex-direction:column;background:radial-gradient(circle at 94% 0%,color-mix(in srgb,var(--orange) 14%,transparent) 0 70px,transparent 71px),var(--canvas)}.view{height:100%;display:flex;flex-direction:column;animation:enter .2s ease both}
    h1,h2,p{margin:0}h1{max-width:430px;color:var(--navy);font-size:27px;line-height:1.08;letter-spacing:-.025em}h2{color:var(--navy);font-size:21px;line-height:1.12;letter-spacing:-.015em}.lead{margin-top:12px;font-size:14px;line-height:1.42}.scene{margin-top:12px;padding:10px 12px;background:var(--surface);border-left:4px solid var(--orange);border-radius:0 12px 12px 0;font-size:12.5px;line-height:1.35}
    .route{margin-top:18px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.route span{padding:9px 4px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:10px;text-align:center;font-size:10px;font-weight:700}.route b{display:block;margin-bottom:4px;color:var(--orange);font-size:16px}
    .primary,.secondary{min-height:40px;padding:8px 13px;border-radius:11px;cursor:pointer;font-weight:800}.primary{color:#fff;background:var(--blue);border:1px solid var(--blue);box-shadow:0 8px 18px color-mix(in srgb,var(--blue) 28%,transparent)}.secondary{color:var(--navy);background:var(--surface);border:1px solid var(--line)}.primary:hover,.secondary:hover{transform:translateY(-1px)}.start{width:100%;margin-top:auto}button:focus-visible{outline:3px solid color-mix(in srgb,var(--orange) 55%,transparent);outline-offset:2px}
    .step{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.step-tag{flex:0 0 auto;padding:5px 8px;color:var(--blue);background:var(--blue-soft);border-radius:8px;font-size:11px;font-weight:800}.question{margin-top:13px;color:var(--navy);font-size:14px;line-height:1.28;font-weight:800}.options{margin-top:10px;display:grid;gap:7px}.option{width:100%;min-height:48px;padding:8px 10px;display:flex;align-items:center;gap:9px;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:11px;text-align:left;font-size:12px;line-height:1.24;cursor:pointer}.option:hover{transform:translateX(2px);border-color:var(--blue)}.letter{flex:0 0 26px;height:26px;display:grid;place-items:center;color:var(--navy);background:var(--blue-soft);border-radius:7px;font-size:11px;font-weight:900}.option.wrong{color:var(--red);background:var(--red-soft);border-color:var(--red);animation:shake .2s ease}.option.correct{color:var(--green);background:var(--green-soft);border-color:var(--green)}
    .feedback{min-height:48px;margin-top:8px;padding:8px 10px;color:var(--muted);background:color-mix(in srgb,var(--surface) 78%,transparent);border:1px solid var(--line);border-radius:10px;font-size:11px;line-height:1.3}.feedback.good{color:var(--green)}.feedback.bad{color:var(--red)}.foot{margin-top:auto;padding-top:8px;display:flex;align-items:center;gap:9px}.progress{height:7px;flex:1;overflow:hidden;background:var(--line);border-radius:999px}.progress div{height:100%;background:linear-gradient(90deg,var(--orange),var(--green));border-radius:inherit;transition:width .25s ease}.next{min-width:138px;min-height:38px}.next[hidden]{display:none}
    .score{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;color:var(--navy);background:var(--green-soft);border:1px solid color-mix(in srgb,var(--green) 42%,var(--line));border-radius:12px;font-size:12px;font-weight:800}.score strong{color:var(--green);font-size:22px}.summary{margin-top:12px;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;font-size:12px;line-height:1.4}.summary p+p{margin-top:7px}.summary b{color:var(--navy)}.actions{margin-top:auto;padding-top:10px;display:grid;grid-template-columns:1fr 1fr;gap:8px}.done{margin-top:14px;padding:13px;color:var(--green);background:var(--green-soft);border:1px solid color-mix(in srgb,var(--green) 40%,var(--line));border-radius:12px;font-size:13px;line-height:1.4}
    @keyframes enter{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}@keyframes shake{35%{transform:translateX(-4px)}70%{transform:translateX(4px)}}@media(max-width:390px){#trainer{border-radius:18px}.stage{padding:14px 11px 12px}h1{font-size:24px}h2{font-size:19px}.option{font-size:11.5px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <div id="trainer" role="region" aria-label="Пробный тренажер по контролю обучения"><header class="top"><div class="kicker">Пробная тренировка · старт</div><div class="counter" id="counter">3 решения</div></header><main class="stage" id="stage"></main></div>
  <script>
  (()=>{
    const stage=document.getElementById('stage'),counter=document.getElementById('counter'),letters=['А','Б','В'];
    const questions=[
      {title:'Сначала — основание',scene:'Кадровик прислал 12 приказов: часть работников перевели на другую работу, у части изменилось только название подразделения. Учебный центр предлагает всем программы Б и В заново.',question:'Что специалисту по ОТ проверить до назначения повторного обучения?',options:['Стоимость одинакового пакета для всех работников','Для каждого работника — какое обучение и какие инструктажи он прошел, изменились ли условия труда, источники опасности, уровни профессиональных рисков и характер работы','Только дату последнего протокола по программе Б'],correct:1,good:'Верно. Сначала сравнивают уже пройденное обучение и фактическую работу. Только после этого определяют инструктажи, программы А, Б или В, проверку знания требований охраны труда и стажировку на рабочем месте.',bad:'Пока нет. Назначение повторного обучения зависит не от общего пакета и не от одной даты протокола, а от уже пройденного обучения и фактических изменений в работе.'},
      {title:'Затем — формат',scene:'Начальник цеха просит провести дистанционно всю подготовку: теорию, практику по первой помощи и применению СИЗ, а также занятие на тренажере.',question:'Какое решение соответствует Порядку № 2464?',options:['Провести все дистанционно, если работник подпишет протокол','Разделить формат: теорию можно провести дистанционно, а практические занятия по первой помощи и применению СИЗ, на полигоне и тренажере — только очно','Провести все очно только в учебном центре'],correct:1,good:'Точно. Дистанционный формат не заменяет перечисленные практические занятия. При этом теорию не обязательно переносить в учебный центр.',bad:'Проверьте, какие занятия прямо исключены из дистанционного формата. Экономить можно на организации теории, но не на обязательной практической отработке.'},
      {title:'В финале — результат',scene:'У Сергея есть протокол проверки знания по программам Б и В. На безопасной установке он остановил конвейер, но не изолировал электрическую и пневматическую энергию.',question:'Что сделать до решения о повторном обучении всей бригады?',options:['Оформить еще один протокол по программе В','Проверить программу В, практическое задание и действия Сергея, установить причину ошибки и выбрать конкретное корректирующее действие','Повторить всей бригаде теоретическую часть программы Б'],correct:1,good:'Верно. Протокол не показывает безопасное выполнение конкретной операции. Сначала устанавливают причину ошибки, затем выбирают индивидуальную практику, корректировку программы или устранение опасного условия.',bad:'Повтор теории или новый протокол не объяснят, почему Сергей пропустил изоляцию энергии. Сначала проверьте программу, практику и само действие.'}
    ];
    let index=0,score=0,tried=false;
    function start(){index=0;score=0;tried=false;counter.textContent='3 решения';stage.innerHTML=`<section class="view"><h1>Проверьте три решения по подготовке работников</h1><p class="lead">Проверьте три решения руководителя: кого повторно обучать, что можно проводить дистанционно и достаточно ли протокола для допуска к безопасной работе.</p><div class="route"><span><b>1</b>Основание</span><span><b>2</b>Формат</span><span><b>3</b>Результат</span></div><button class="primary start" id="start">Начать разминку</button></section>`;document.getElementById('start').onclick=render}
    function render(){const q=questions[index];counter.textContent=`${index+1} из 3`;stage.innerHTML=`<section class="view"><div class="step"><h2>${q.title}</h2><span class="step-tag">Решение ${index+1}</span></div><div class="scene">${q.scene}</div><p class="question">${q.question}</p><div class="options">${q.options.map((x,i)=>`<button class="option" data-i="${i}"><span class="letter">${letters[i]}</span><span>${x}</span></button>`).join('')}</div><div class="feedback" id="feedback" role="status">Выберите вариант. После ошибки появится подсказка.</div><div class="foot"><div class="progress"><div style="width:${index/3*100}%"></div></div><button class="primary next" id="next" hidden>${index===2?'Завершить':'Следующее решение'}</button></div></section>`;stage.querySelectorAll('.option').forEach(b=>b.onclick=()=>choose(b,+b.dataset.i))}
    function choose(button,i){const q=questions[index],fb=document.getElementById('feedback'),next=document.getElementById('next');stage.querySelectorAll('.option').forEach(x=>x.classList.remove('wrong'));if(i!==q.correct){tried=true;button.classList.add('wrong');fb.className='feedback bad';fb.textContent=`Пока нет. ${q.bad}`;return}if(!tried)score++;button.classList.add('correct');stage.querySelectorAll('.option').forEach(x=>x.disabled=true);fb.className='feedback good';fb.textContent=q.good;next.hidden=false;next.onclick=advance}
    function advance(){tried=false;if(index<2){index++;render()}else result()}
    function result(){counter.textContent='Готово';stage.innerHTML=`<section class="view"><div class="score"><span>Верно с первой попытки</span><strong>${score}/3</strong></div><div class="summary"><p><b>Основание:</b> сначала сравните подготовку и фактическую работу.</p><p><b>Формат:</b> отделите дистанционную теорию от обязательной очной практики.</p><p><b>Результат:</b> проверьте программу и безопасное действие до повторного обучения всей группы.</p></div><div class="actions"><button class="secondary" id="again">Пройти еще раз</button><button class="primary" id="forward">Двигаться дальше</button></div></section>`;document.getElementById('again').onclick=start;document.getElementById('forward').onclick=forward}
    function forward(){window.parent.postMessage({type:'course-next',source:'lesson-1-trial'},'*');stage.innerHTML=`<section class="view"><h1>Разминка завершена</h1><div class="done"><b>Двигайтесь дальше.</b><br>В следующем уроке соберите матрицу: определите обязательную подготовку, сроки и формат для перевода работника.</div><button class="secondary start" id="again">Пройти еще раз</button></section>`;counter.textContent='Урок 2';document.getElementById('again').onclick=start}
    start();
  })();
  </script>
</body>
</html>
