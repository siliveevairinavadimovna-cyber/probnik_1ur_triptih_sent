<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Тренажер по обучению работников</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      width: 100vw;
      height: 100vh;
      padding: 12px;
      overflow: hidden;
      display: flex;
      background: #edf4f7;
      font-family: Arial, sans-serif;
      color: #17324d;
    }

    .trainer {
      width: 100%;
      height: 100%;
      padding: 24px 28px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 11px;
      overflow-y: auto;
      border: 1px solid #d7e4eb;
      border-radius: 24px;
      background:
        radial-gradient(
          circle at 100% 0,
          #d9f2fa 0 105px,
          transparent 106px
        ),
        linear-gradient(160deg, #ffffff, #f8fbfd);
      box-shadow: 0 18px 45px rgba(23, 50, 77, 0.14);
    }

    .trainer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .kicker {
      margin: 0;
      color: #176b9b;
      font-size: 12px;
      font-weight: 800;
      line-height: 1.2;
      letter-spacing: 0.07em;
      text-transform: uppercase;
    }

    .progress {
      min-width: 64px;
      padding: 7px 11px;
      flex: 0 0 auto;
      border: 1px solid #a8d5e7;
      border-radius: 20px;
      background: #ffffff;
      color: #176b9b;
      font-size: 12px;
      font-weight: 800;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: 30px;
      line-height: 1.08;
      letter-spacing: -0.025em;
    }

    .situation {
      margin: 0;
      padding: 13px 16px;
      border-left: 5px solid #f0a73f;
      border-radius: 0 14px 14px 0;
      background: #fff8e9;
      color: #4e5964;
      font-size: 14px;
      line-height: 1.4;
    }

    .question {
      margin: 1px 0 0;
      font-size: 15px;
      font-weight: 800;
    }

    .answers {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 13px;
    }

    .answer {
      min-height: 112px;
      padding: 14px;
      border: 2px solid #d7e4eb;
      border-radius: 15px;
      background: rgba(255, 255, 255, 0.96);
      color: #17324d;
      text-align: left;
      cursor: pointer;
      transition:
        transform 0.15s ease,
        border-color 0.15s ease,
        background 0.15s ease;
    }

    .answer:hover {
      transform: translateY(-2px);
      border-color: #85bbd4;
    }

    .answer:focus-visible,
    .main-button:focus-visible {
      outline: 3px solid rgba(23, 107, 155, 0.25);
      outline-offset: 2px;
    }

    .answer.selected {
      border-color: #176b9b;
      background: #e8f5fb;
    }

    .answer.correct {
      border-color: #21855b;
      background: #eaf8f1;
    }

    .answer.wrong {
      border-color: #b74848;
      background: #fff0ef;
    }

    .answer-top {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .answer-letter {
      width: 29px;
      height: 29px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border-radius: 8px;
      background: #17324d;
      color: #ffffff;
      font-size: 14px;
      font-weight: 900;
    }

    .answer-title {
      font-size: 15px;
      font-weight: 800;
      line-height: 1.2;
    }

    .answer-text {
      display: block;
      margin-top: 9px;
      color: #61758a;
      font-size: 13px;
      line-height: 1.35;
    }

    .button-row {
      display: flex;
      justify-content: flex-end;
      margin-top: 2px;
    }

    .main-button {
      min-width: 180px;
      min-height: 45px;
      padding: 0 18px;
      border: 0;
      border-radius: 13px;
      background: #176b9b;
      color: #ffffff;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 7px 16px rgba(23, 107, 155, 0.22);
    }

    .main-button:disabled {
      opacity: 0.4;
      cursor: default;
      box-shadow: none;
    }

    .feedback {
      min-height: 68px;
      padding: 13px 16px;
      border: 1px solid #d7e4eb;
      border-radius: 13px;
      background: #ffffff;
      color: #61758a;
      font-size: 14px;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }

    .feedback strong {
      color: #17324d;
    }

    .feedback.good {
      border-color: #a7d9c1;
      background: #eaf8f1;
      color: #28694e;
    }

    .feedback.bad {
      border-color: #e9b2ae;
      background: #fff0ef;
      color: #8e3b3b;
    }

    .dots {
      min-height: 9px;
      display: flex;
      justify-content: center;
      gap: 6px;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #cfdae1;
      transition: 0.15s ease;
    }

    .dot.completed {
      background: #83b9d1;
    }

    .dot.active {
      width: 28px;
      border-radius: 5px;
      background: #176b9b;
    }

    @media (max-width: 650px) {
      body {
        padding: 7px;
      }

      .trainer {
        padding: 15px;
        justify-content: flex-start;
        gap: 8px;
        border-radius: 18px;
      }

      .kicker {
        font-size: 10px;
      }

      .progress {
        min-width: 52px;
        padding: 5px 8px;
        font-size: 10px;
      }

      h1 {
        font-size: 22px;
      }

      .situation {
        padding: 9px 10px;
        font-size: 11px;
      }

      .question {
        font-size: 12px;
      }

      .answers {
        gap: 7px;
      }

      .answer {
        min-height: 90px;
        padding: 8px;
      }

      .answer-letter {
        width: 23px;
        height: 23px;
        font-size: 11px;
      }

      .answer-title {
        font-size: 11px;
      }

      .answer-text {
        margin-top: 6px;
        font-size: 10px;
      }

      .main-button {
        min-width: 135px;
        min-height: 37px;
        font-size: 11px;
      }

      .feedback {
        min-height: 52px;
        padding: 9px 10px;
        font-size: 11px;
      }

      .dot {
        width: 7px;
        height: 7px;
      }

      .dot.active {
        width: 20px;
      }
    }
  </style>
</head>

<body>
  <main
    class="trainer"
    aria-label="Тренажер по обучению работников"
  >
    <div class="trainer-header">
      <p class="kicker" id="sectionLabel"></p>
      <span class="progress" id="progress"></span>
    </div>

    <h1 id="title"></h1>

    <p class="situation" id="situation"></p>

    <p class="question">Какое решение вы примете?</p>

    <div
      class="answers"
      role="group"
      aria-label="Варианты ответа"
    >
      <button
        class="answer"
        type="button"
        data-index="0"
        aria-pressed="false"
      >
        <span class="answer-top">
          <span class="answer-letter">А</span>
          <span class="answer-title"></span>
        </span>

        <span class="answer-text"></span>
      </button>

      <button
        class="answer"
        type="button"
        data-index="1"
        aria-pressed="false"
      >
        <span class="answer-top">
          <span class="answer-letter">Б</span>
          <span class="answer-title"></span>
        </span>

        <span class="answer-text"></span>
      </button>
    </div>

    <div class="button-row">
      <button
        class="main-button"
        type="button"
        disabled
      >
        Проверить
      </button>
    </div>

    <div
      class="feedback"
      role="status"
      aria-live="polite"
    >
      Выберите вариант и проверьте решение.
    </div>

    <div class="dots" aria-hidden="true"></div>
  </main>

  <script>
    const situations = [
      {
        section: "Совместительство и новый работник",

        title: "Что назначить работникам?",

        text:
          "Слесарь уже прошел необходимое обучение. При внутреннем совместительстве сохранились условия труда, источники опасности, уровни профрисков и характер работы. Выпускник впервые начал трудовую деятельность и допущен к работе повышенной опасности.",

        answers: [
          {
            title: "Назначить общий срок",

            text:
              "Слесарю — повторное обучение, новичку — инструктаж раз в шесть месяцев."
          },
          {
            title: "Применить разные правила",

            text:
              "Слесарю не назначать обучение из-за совместительства, новичку — инструктаж раз в три месяца."
          }
        ],

        correct: 1,

        success:
          "Пункт 7 освобождает слесаря от обучения из-за совместительства. Плановый срок сохраняется. Новичку проводите повторный инструктаж не реже раза в три месяца в течение первого года работы.",

        error:
          "Для слесаря выполнены условия пункта 7. Обучение из-за совместительства не требуется. Новичку нужен повторный инструктаж не реже раза в три месяца в течение первого года работы."
      },

      {
        section: "Срок обучения по программе В",

        title: "Какой срок поставить?",

        text:
          "Работник прошел обучение по программе В 15 сентября 2026 года. Для этой работы нормативные правовые акты не устанавливают отдельную периодичность обучения.",

        answers: [
          {
            title: "До сентября 2029 года",

            text:
              "Назначить следующее обучение не позднее 15 сентября 2029 года."
          },
          {
            title: "Только после изменений",

            text:
              "Не ставить дату и обучить работника только после изменения правил или технологии."
          }
        ],

        correct: 0,

        success:
          "Если нормативные правовые акты не установили другой срок, обучение по программе В проводят не реже одного раза в три года.",

        error:
          "Для программы В нужен плановый срок. Если нормативные правовые акты не установили другой период, обучение проводят не реже одного раза в три года."
      },

      {
        section: "Формат обучения первой помощи",

        title: "Какой курс согласовать?",

        text:
          "Учебный центр предлагает провести обучение по первой помощи полностью дистанционно: показать приемы по видео и завершить курс онлайн-тестом.",

        answers: [
          {
            title: "Весь курс онлайн",

            text:
              "Согласовать дистанционный формат для теории и практических занятий."
          },
          {
            title: "Разделить форматы",

            text:
              "Непрактическую часть провести дистанционно, а практические занятия — очно."
          }
        ],

        correct: 1,

        success:
          "Практические занятия по первой помощи нельзя проводить дистанционно. На них отводят не менее 50 процентов общего количества учебных часов.",

        error:
          "Просмотр видео не заменяет практическое занятие. Практику проводят без дистанционных технологий и отводят на нее не менее 50 процентов программы."
      }
    ];

    const sectionLabel =
      document.querySelector("#sectionLabel");

    const progress =
      document.querySelector("#progress");

    const title =
      document.querySelector("#title");

    const situationText =
      document.querySelector("#situation");

    const answerButtons = [
      ...document.querySelectorAll(".answer")
    ];

    const mainButton =
      document.querySelector(".main-button");

    const feedback =
      document.querySelector(".feedback");

    const dotsContainer =
      document.querySelector(".dots");

    let currentSituation = 0;
    let selectedAnswer = null;
    let answerChecked = false;

    function renderDots() {
      dotsContainer.innerHTML = "";

      situations.forEach((item, index) => {
        const dot = document.createElement("span");

        dot.className = "dot";

        if (index < currentSituation) {
          dot.classList.add("completed");
        }

        if (index === currentSituation) {
          dot.classList.add("active");
        }

        dotsContainer.appendChild(dot);
      });
    }

    function renderSituation() {
      const item = situations[currentSituation];

      selectedAnswer = null;
      answerChecked = false;

      sectionLabel.textContent = item.section;

      progress.textContent =
        `${currentSituation + 1} из ${situations.length}`;

      title.textContent = item.title;
      situationText.textContent = item.text;

      answerButtons.forEach((button, index) => {
        button.className = "answer";
        button.setAttribute("aria-pressed", "false");

        button
          .querySelector(".answer-title")
          .textContent = item.answers[index].title;

        button
          .querySelector(".answer-text")
          .textContent = item.answers[index].text;
      });

      mainButton.disabled = true;
      mainButton.textContent = "Проверить";

      feedback.className = "feedback";

      feedback.textContent =
        "Выберите вариант и проверьте решение.";

      renderDots();
    }

    answerButtons.forEach((button) => {
      button.addEventListener("click", () => {
        selectedAnswer = Number(button.dataset.index);
        answerChecked = false;

        answerButtons.forEach((item) => {
          item.className = "answer";
          item.setAttribute("aria-pressed", "false");
        });

        button.classList.add("selected");
        button.setAttribute("aria-pressed", "true");

        mainButton.disabled = false;
        mainButton.textContent = "Проверить";

        feedback.className = "feedback";

        feedback.textContent =
          "Ответ выбран. Нажмите «Проверить».";
      });
    });

    mainButton.addEventListener("click", () => {
      const item = situations[currentSituation];

      if (!answerChecked) {
        answerChecked = true;

        answerButtons.forEach((button) => {
          button.classList.remove(
            "selected",
            "correct",
            "wrong"
          );
        });

        answerButtons[item.correct]
          .classList.add("correct");

        if (selectedAnswer === item.correct) {
          feedback.className = "feedback good";

          feedback.innerHTML =
            `<strong>Верно.</strong> ${item.success}`;
        } else {
          answerButtons[selectedAnswer]
            .classList.add("wrong");

          feedback.className = "feedback bad";

          feedback.innerHTML =
            `<strong>Не совсем.</strong> ${item.error}`;
        }

        if (currentSituation < situations.length - 1) {
          mainButton.textContent =
            "Следующая ситуация";
        } else {
          mainButton.textContent =
            "Пройти заново";
        }

        return;
      }

      if (currentSituation < situations.length - 1) {
        currentSituation += 1;
      } else {
        currentSituation = 0;
      }

      renderSituation();
    });

    renderSituation();
  </script>
</body>
</html>
